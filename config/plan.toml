# Planner settings. `wof plan` expands the full matrix; on GHA (eval.yml) a
# scheduled run takes a seeded sample of it (anchors first), and a manual run
# names its cells. Budget-weighted sampling (PLAN §6) is still to come.

reps = 3

# Per-run caps passed to the harness adapter (§9 used 150 turns, 25 minutes;
# decided 2026-11-14: 150 turns, 30 minutes, $3, after every phase 1 smoke
# run stopped at 60 turns / 20 minutes / $1 before finishing).
[caps]
max_turns = 150
timeout_minutes = 30
max_cost_usd = 3.0

# The anchor set (PLAN §1.1): cells re-run every month so drift in the
# harness, provider or scoring shows up as the anchors moving. A cell matches
# when task, harness, model and treatment all match (any rep).
[[anchors]]
task = "hedgedoc-ingress"
harness = "pi"
model = "deepseek-v4-pro"
treatment = "none"

[[anchors]]
task = "hedgedoc-ingress"
harness = "pi"
model = "deepseek-v4-pro"
treatment = "howto"

# The GitHub Actions eval (eval.yml, phase 3). `max_cells` is a hard cap per
# workflow run: `wof plan --matrix-json` fails rather than emit more, whatever
# the inputs say. At the caps above a full 24-cell run can spend at most $72;
# the OpenRouter key's own credit limit is the real ceiling.
[gha]
max_cells = 24
scheduled_sample = 8   # the weekly run; anchors run monthly, on their own
