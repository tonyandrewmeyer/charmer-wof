# Planner settings. `wof plan` expands the full matrix; on GHA (eval.yml) a
# scheduled run samples it: a task first (every task once before any twice),
# then that task's cell with the fewest records in the current series, read
# from the results branch and seeded by the run's date (planner.sample). The
# monthly anchor run takes the anchors, and a manual run names its cells.
# Weighting by spend and event-triggered cells (PLAN §6) are still to come.

reps = 3

# Per-run caps passed to the harness adapter (§9 used 150 turns, 25 minutes;
# decided 2026-11-14: 150 turns, 30 minutes, $3, after every phase 1 smoke
# run stopped at 60 turns / 20 minutes / $1 before finishing).
[caps]
max_turns = 150
timeout_minutes = 30
max_cost_usd = 3.0

# The anchor set (PLAN §1.1): cells re-run every month so drift in the
# harness, provider or scoring shows up as the anchors moving. A cell matches
# when task, harness, model and treatment all match (any rep).
[[anchors]]
task = "hedgedoc-ingress"
harness = "pi"
model = "deepseek-v4-pro"
treatment = "none"

[[anchors]]
task = "hedgedoc-ingress"
harness = "pi"
model = "deepseek-v4-pro"
treatment = "howto"

# The GitHub Actions eval (eval.yml, phase 3). `max_cells` is a hard cap per
# workflow run: `wof plan --matrix-json` fails rather than emit more, whatever
# the inputs say. At the caps above a full 24-cell run can spend at most $72;
# the OpenRouter key's own credit limit is the real ceiling.
[gha]
max_cells = 24
# The weekly run (eval.yml, Mondays): this many cells from the feature tasks
# only. New-charm briefs are out of it (decided 2026-11-25): one brief at its
# $3 cap was a third of the first scheduled run's spend.
scheduled_sample = 8
# The monthly new-charm slot (eval.yml, the 17th): this many cells from the
# briefs only. PLAN §6 budgets 2-4 new-charm runs a month; at the $3 cap two
# cells can spend at most $6.
new_charm_sample = 2
