[tasks.alertmanager-workload-tracing]
version = "1"
kind = "feature"
held_out = false
description = """
alertmanager-k8s (Observability) with workload tracing removed: the `tracing`
endpoint (tempo_coordinator_k8s tracing v0, otlp_http), the `tracing:` section
of alertmanager.yml, and OTEL_RESOURCE_ATTRIBUTES on the workload. Observability
feature, K8s charm, added upstream 2026-05-27.
"""
gold_repo = "https://github.com/canonical/alertmanager-k8s-operator"
gold_sha = "2a9d804e25bc6dbe786859134482980d3f78712a"
removal_diff = "tasks/alertmanager-workload-tracing/removal.diff"
removal_strip = 1
remove_paths = ["lib/charms/tempo_coordinator_k8s/v0/tracing.py"]
prompt = "tasks/alertmanager-workload-tracing/prompt.md"
context_file = "CLAUDE.md"
# requires-python = "~=3.14.0"
python = "3.14"
judge_criteria = "tasks/alertmanager-workload-tracing/judge-criteria.md"

[tasks.alertmanager-workload-tracing.oracle]
# The gold's tests/unit/test_workload_tracing.py minus its TestConfigBuilder
# class, which calls ConfigBuilder.set_workload_tracing(endpoint=, ca_cert_path=)
# directly; the rest go through ops.testing and the rendered config file. Uses
# the gold's own conftest fixtures and helpers.workload_file, which stay in the base.
files = ["tasks/alertmanager-workload-tracing/oracle/test__oracle_workload_tracing.py"]
install_dir = "tests/unit"
# tox.ini [testenv:unit]: JUJU_VERSION and PYTHONPATH come from tox.
command = [
    "env", "JUJU_VERSION=3.0.3", "PYTHONPATH=.:lib:src",
    "uv", "run", "--no-progress", "--frozen", "--extra", "dev",
    "pytest", "tests/unit", "-q", "-p", "no:cacheprovider",
]
marker = "test__oracle_"
key_tests = [
    "test_oracle_an_http_tempo_endpoint_is_written_to_the_workload_config",
    "test_oracle_an_https_tempo_endpoint_is_written_to_the_workload_config",
]
# The relation's URL reaching alertmanager.yml as host:port is the feature;
# the no-relation test passes on the base by construction.
key_test = "test_oracle_an_http_tempo_endpoint_is_written_to_the_workload_config"

[tasks.alertmanager-workload-tracing.static_checks]
endpoints = [{ name = "tracing", interface = "tracing", role = "requires" }]
files_present = ["lib/charms/tempo_coordinator_k8s/v0/tracing.py"]
# The gold's own lint (tox -e lint) covers src/ and tests/, not the vendored libs.
ruff_exclude = ["lib"]

