# Tasks (PLAN §2). Paths are relative to the root of the config tree that
# declares the task (this package for public tasks; the private repo for
# held-out ones, PLAN §8 2026-11-09). Bump `version` whenever anything the
# agent sees or the oracle checks changes: the prompt, the removal diff, the
# gold SHA, the oracle files or the static checks.

[tasks.hedgedoc-ingress]
# v2 (2026-11-17): transcripts/ removed from the workspace; it holds the
# sessions that built the gold, strip_prefix=True included (PLAN §7).
version = "2"
kind = "feature"
held_out = false
description = """
§9 task T2: the hedgedoc-operator exemplar with ingress (traefik_k8s ingress
v2) surgically removed; the agent puts it back so HedgeDoc works under
Traefik's /<model>-<app> prefix.
"""
gold_repo = "https://github.com/tonyandrewmeyer/hedgedoc-operator"
gold_private = true  # read token on GHA: HEDGEDOC_GOLD_TOKEN (prep job only)
# The oldest commit the recorded removal diff applies to cleanly; the §9
# reference-t2 tree was copied on 2026-09-21 and matches it.
gold_sha = "85cec91dfa3b1ce8f74f1ede836ede1bd45e5b9b"
# Applied with `git apply -p1` to the gold checkout (paths are
# reference-t2/... -> base-t2/...). The diff was made with -x lib, so the
# vendored library is removed separately via remove_paths. It also adds the
# agent context file (CLAUDE.md): see context_file.
removal_diff = "tasks/hedgedoc-ingress/removal.diff"
removal_strip = 1
remove_paths = ["lib/charms/traefik_k8s/v2/ingress.py", "transcripts"]
prompt = "tasks/hedgedoc-ingress/prompt.md"
# The context file the removal diff creates. Treatments append to it; a
# harness adapter that reads AGENTS.md instead links or copies it (phase 1).
context_file = "CLAUDE.md"
# The charm runs on Ubuntu 24.04 (Python 3.12). Without a pin uv builds the
# charm's venv with whatever Python is about, and on 3.11 the gold's own
# filterwarnings=error turns an opentelemetry DeprecationWarning into a
# collection error for every test.
python = "3.12"
judge_criteria = "tasks/hedgedoc-ingress/judge-criteria.md"

[tasks.hedgedoc-ingress.oracle]
# Copied into install_dir after the agent finishes, run with the charm's own
# environment, and removed again. Results come from JUnit XML; tests whose
# classname contains `marker` are the oracle, the rest are the agent's own.
files = [
    "tasks/hedgedoc-ingress/oracle/test__oracle_ingress.py",
    "tasks/hedgedoc-ingress/oracle/test__oracle_ingress_exemplar.py",
]
install_dir = "tests/unit"
command = ["uv", "run", "--no-progress", "pytest", "tests/unit", "-q", "-p", "no:cacheprovider"]
marker = "test__oracle_"
# Tests reported individually in the record, because the pass count
# saturates at the frontier (§9.1) and these are the discriminating ones.
key_tests = ["test_oracle_requirer_asks_traefik_to_strip_the_prefix"]
# The test that checks the feature itself; failing it tags the oracle tier
# key-oracle-test-failed whatever the rest scored. HedgeDoc 1.x serves from /
# and only uses CMD_URL_PATH to build links, so behind Traefik's
# /<model>-<app> prefix it works only if Traefik strips the prefix: without
# strip-prefix every request 404s, however right the domain, scheme and path
# settings are. It's also the round-2 / §9 miss (HARNESS.md).
key_test = "test_oracle_requirer_asks_traefik_to_strip_the_prefix"

[tasks.hedgedoc-ingress.static_checks]
endpoints = [{ name = "ingress", interface = "ingress", role = "requires" }]
charm_libs = [{ lib = "traefik_k8s.ingress", version = "2" }]
files_present = ["lib/charms/traefik_k8s/v2/ingress.py"]

